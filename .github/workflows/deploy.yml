name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: "Deploy — Production"
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment configuration
        id: validate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
        run: |
          missing=()
          for name in \
            DEPLOY_HOST \
            DEPLOY_USER \
            DEPLOY_SSH_KEY \
            DEPLOY_PATH \
            VITE_BACKEND_URL \
            VITE_API_URL \
            VITE_STRIPE_PUBLISHABLE_KEY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Production deployment skipped; missing Actions secrets: ${missing[*]}"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Build client
        working-directory: client
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
        run: npm ci && npm run build

      - name: Add SSH key
        if: steps.validate.outputs.configured == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known hosts
        if: steps.validate.outputs.configured == 'true'
        run: |
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # ── Upload built frontend to server ───────────────────────────────────
      - name: Upload client/dist to server
        if: steps.validate.outputs.configured == 'true'
        run: |
          rsync -az --delete \
            client/dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/client/dist/

      # ── SSH deploy script ──────────────────────────────────────────────────
      - name: Deploy on server
        if: steps.validate.outputs.configured == 'true'
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST << ENDSSH
            set -e
            cd $DEPLOY_PATH/server
            npm ci --omit=dev
            pm2 describe rentifi-server > /dev/null 2>&1 \
              && pm2 reload rentifi-server --update-env \
              || pm2 start server.js --name rentifi-server --env production
            pm2 save
          ENDSSH
