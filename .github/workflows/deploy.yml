name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: "Deploy — Production"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Build client
        working-directory: client
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
        run: npm ci && npm run build

      - name: Validate deployment configuration
        id: validate
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -n "$DEPLOY_SSH_KEY" ] \
            && [ -n "$DEPLOY_HOST" ] \
            && [ -n "$DEPLOY_USER" ] \
            && [ -n "$DEPLOY_PATH" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deployment secrets are not configured; skipping production deployment."
          fi

      - name: Add SSH key
        if: steps.validate.outputs.configured == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known hosts
        if: steps.validate.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload client build
        if: steps.validate.outputs.configured == 'true'
        run: |
          rsync -az --delete \
            client/dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/client/dist/

      - name: Restart server
        if: steps.validate.outputs.configured == 'true'
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST << ENDSSH
            set -e
            cd $DEPLOY_PATH/server
            npm ci --omit=dev
            pm2 describe rentifi-server > /dev/null 2>&1 \
              && pm2 reload rentifi-server --update-env \
              || pm2 start server.js --name rentifi-server --env production
            pm2 save
          ENDSSH
