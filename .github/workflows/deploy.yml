name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: "Deploy — Production"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Build client
        working-directory: client
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
        run: npm ci && npm run build

      - name: Add SSH key
        if: steps.validate.outputs.configured == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload client build
        run: |
          rsync -az --delete \
            client/dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/client/dist/

      - name: Restart server
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST << ENDSSH
            set -e
            cd $DEPLOY_PATH/server
            npm ci --omit=dev
            pm2 describe rentifi-server > /dev/null 2>&1 \
              && pm2 reload rentifi-server --update-env \
              || pm2 start server.js --name rentifi-server --env production
            pm2 save
          ENDSSH
