# ─────────────────────────────────────────────────────────────────────────────
# PR Check — fast feedback on pull requests
#
# Runs a quick lint + build in parallel so reviewers know the PR is safe
# before the full CI matrix finishes. Posts a summary to the PR.
# ─────────────────────────────────────────────────────────────────────────────

name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  client-check:
    name: "Client — Quick Check"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "18.x"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - run: npm ci
        working-directory: client

      - name: Type-check
        working-directory: client
        run: npx tsc --noEmit

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Build (production)
        working-directory: client
        env:
          VITE_BACKEND_URL: "https://api.rentifi.com"
          VITE_API_URL: "https://api.rentifi.com"
          VITE_STRIPE_PUBLISHABLE_KEY: "pk_test_placeholder"
        run: npm run build

  server-check:
    name: "Server — Quick Check"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "18.x"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: server

      - name: Syntax check
        working-directory: server
        run: |
          find . \
            -name "*.js" \
            -not -path "*/node_modules/*" \
            -not -path "*/scripts/*" \
          | while read f; do node --check "$f"; done

  # ── Summary comment on the PR ──────────────────────────────────────────────
  pr-summary:
    name: "PR Summary"
    runs-on: ubuntu-latest
    needs: [client-check, server-check]
    if: always()
    permissions:
      pull-requests: write

    steps:
      - name: Post status comment
        uses: actions/github-script@v7
        with:
          script: |
            const clientStatus = '${{ needs.client-check.result }}';
            const serverStatus = '${{ needs.server-check.result }}';
            const allPassed = clientStatus === 'success' && serverStatus === 'success';

            const icon   = (s) => s === 'success' ? '✅' : s === 'skipped' ? '⏭️' : '❌';
            const sha    = context.payload.pull_request.head.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              `## ${allPassed ? '✅ All checks passed' : '❌ Some checks failed'} — \`${sha}\``,
              '',
              '| Job | Status |',
              '|-----|--------|',
              `| Client lint + type-check + build | ${icon(clientStatus)} ${clientStatus} |`,
              `| Server syntax check | ${icon(serverStatus)} ${serverStatus} |`,
              '',
              allPassed
                ? '> This PR is safe to review and merge.'
                : `> One or more checks failed. [View details](${runUrl}).`,
            ].join('\n');

            // Find existing bot comment and update, or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('All checks passed') ||
              c.user.type === 'Bot' && c.body.includes('Some checks failed')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
